    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        /* Light "paper" surfaces: cards, newsprint, tags, buttons. */
        --paper-bg: oklch(93% .03 85);
        --paper-ink: oklch(24% .02 60);
        --paper-ink-soft: oklch(48% .03 62);
        --paper-rule: oklch(62% .04 65);

        /* The page itself: deep space navy with white type. */
        --space: #040b18;
        --navy: #0d3a66;
        --paper: rgb(5 14 30 / .9);
        --card: oklch(96% .022 88);
        --ink: oklch(97% .01 240);
        --ink-soft: oklch(80% .03 240);
        --rule: color-mix(in oklch, white 24%, transparent);
        --shadow: rgb(0 0 0 / .55);

        --blueprint: oklch(38% .1 245);
        --blueprint-ink: oklch(95% .03 240);
        --kraft: oklch(82% .06 78);
        --safety: #f2b01e;
        --rust: oklch(68% .17 48);
        --stamp: oklch(53% .18 28);
      }
      /* Anything on a light surface switches back to dark ink. */
      .paper, .sheet, .newsprint, .kraft {
        --ink: var(--paper-ink);
        --ink-soft: var(--paper-ink-soft);
        --rule: var(--paper-rule);
        --paper: var(--paper-bg);
        --shadow: var(--paper-ink);
        color: var(--ink);
        text-shadow: none;
      }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        color: var(--ink);
        font-family: "Courier Prime", ui-monospace, monospace;
        background-color: var(--space);
        /* Keeps white type crisp where network lines pass behind it. */
        text-shadow: 0 1px 3px var(--space), 0 0 1px var(--space);
      }
      /* Fixed layer behind everything: gradient here, nodes on the canvas. */
      .network-bg {
        position: fixed; inset: 0; z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(1200px 800px at 15% -10%, rgb(13 58 102 / .85), transparent 60%),
          radial-gradient(900px 700px at 100% 110%, rgb(16 72 128 / .45), transparent 60%),
          linear-gradient(180deg, #071427 0%, var(--space) 100%);
      }
      .network-bg canvas { display: block; width: 100%; height: 100%; }
      .font-stencil { font-family: "Saira Stencil One", ui-sans-serif, system-ui; }
      .font-type { font-family: "Special Elite", "Courier Prime", monospace; }
      .font-news { font-family: "Playfair Display", Georgia, serif; }
      .font-serif-body { font-family: "Source Serif 4", Georgia, serif; }
      .font-masthead { font-family: "Grenze Gotisch", "Playfair Display", serif; font-weight: 800; }

      /* Newspaper pages sit on clean newsprint instead of graph paper. */
      .newsprint {
        background: oklch(97% .012 88);
        color: oklch(20% .015 60);
        border: 1px solid var(--ink);
        box-shadow: 6px 6px 0 var(--shadow);
      }
      .rule-double { border-top: 3px double var(--ink); }
      .rule { border-top: 1px solid var(--ink); }
      .kicker { font-family: "Courier Prime", monospace; font-weight: 700; font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; color: var(--stamp); }
      .article-body p { margin: 0 0 1em; text-align: justify; hyphens: auto; line-height: 1.65; }
      .article-body h2 { font-family: "Courier Prime", monospace; font-weight: 700; font-size: .8rem; letter-spacing: .15em; text-transform: uppercase; margin: 1.6em 0 .6em; break-after: avoid; }
      .article-body > p:first-of-type::first-letter {
        font-family: "Playfair Display", serif; font-weight: 900;
        float: left; font-size: 4.2em; line-height: .8; padding: .08em .1em 0 0;
      }
      @media (min-width: 768px) { .news-columns { column-count: 2; column-gap: 2.5rem; column-rule: 1px solid color-mix(in oklch, var(--ink) 25%, transparent); } }
      .pull-quote { break-inside: avoid; }
      @keyframes flash { from { background: var(--safety); } to { background: transparent; } }
      .flash { animation: flash .9s ease-out; }

      /* Navy panels. Translucent on the page so the network shows through. */
      .blueprint {
        --ink: color-mix(in oklch, var(--blueprint-ink) 30%, transparent);
        background: linear-gradient(155deg, rgb(13 58 102 / .72), rgb(7 30 58 / .72));
        color: var(--blueprint-ink);
      }
      .sheet .blueprint, .newsprint .blueprint { background: var(--navy); }
      .sheet {
        position: relative;
        background: var(--card);
        border: 2px solid var(--ink);
        box-shadow: 6px 6px 0 var(--shadow);
      }
      .sheet::before {
        content: "";
        position: absolute; top: 8px; left: 8px;
        width: 8px; height: 8px; border-radius: 9999px;
        border: 1.5px solid var(--ink);
      }
      .kraft { background: var(--kraft); }
      .btn {
        display: inline-flex; align-items: center; gap: .5rem;
        padding: .9rem 1.4rem;
        font-weight: 700; font-size: .85rem; letter-spacing: .1em; text-transform: uppercase;
        border: 2px solid var(--ink);
        transition: transform .12s ease, box-shadow .12s ease;
      }
      .btn-safety, .tag { text-shadow: none; }
      .btn-safety { background: var(--safety); color: var(--paper-ink); border-color: var(--paper-ink); box-shadow: 4px 4px 0 var(--paper-ink); }
      .btn-safety:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--paper-ink), 0 0 24px rgb(242 176 30 / .35); }
      .btn-ghost { color: var(--blueprint-ink); border-color: var(--blueprint-ink); }
      .btn-ghost:hover { background: rgba(255,255,255,.1); }
      .tag {
        background: var(--safety); color: var(--paper-ink);
        border: 1.5px solid var(--paper-ink);
        font-size: .7rem; font-weight: 700; letter-spacing: .15em;
        padding: .15rem .55rem;
      }
      .stamp {
        display: inline-block;
        color: var(--stamp); border: 2px solid var(--stamp);
        font-weight: 700; font-size: .75rem; letter-spacing: .15em;
        padding: .15rem .5rem; transform: rotate(-4deg);
      }
      .field {
        width: 100%; background: transparent;
        border: 0; border-bottom: 2px solid var(--ink);
        padding: .5rem 0; outline: none; font: inherit;
      }
      .field:focus { border-color: var(--blueprint); }
    </style>
